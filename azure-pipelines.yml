trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  GRADLE_USER_HOME: $(Pipeline.Workspace)/.gradle

steps:
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  - task: Cache@2
    inputs:
      key: 'gradle | "$(Agent.OS)" | **/gradle-wrapper.properties'
      restoreKeys: |
        gradle | "$(Agent.OS)"
      path: $(GRADLE_USER_HOME)

  - script: chmod +x ./gradlew
    displayName: 'Make gradlew executable'

  - script: ./gradlew lintDebug
    displayName: 'Run Lint'

  - script: ./gradlew testDebugUnitTest
    displayName: 'Run Unit Tests'

  - script: ./gradlew assembleDebug
    displayName: 'Build Debug APK'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'app/build/outputs/apk/debug/app-debug.apk'
      ArtifactName: 'app-debug-apk'
    displayName: 'Publish APK Artifact'